version = "0.1.0"
description = ""
authors = [
    {name = "John Cruz",email = "jfcruz.ibp@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas (>2.3.0,<3.0)",
    "dvc (>=3.67.1,<4.0.0)",
    "scikit-learn (>=1.9.0,<2.0.0)",
    "fastapi (>=0.139.2,<0.140.0)",
    "pydantic = 2.10.0"
    "mlflow (>=3.14.0,<4.0.0)",
    "numpy (<2.2.0)",
    "joblib = 1.4.0"
    "uvicorn (>=0.51.0,<0.52.0)",
    "yfinance (>=1.5.1,<2.0.0)"
]

[tool.poetry.scripts]
start = "uvicorn src.financial_api.api:app --host 0.0.0.0 --port 8000"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
