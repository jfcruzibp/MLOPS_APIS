[project]
name = "mlops-apis"
version = "1.0.0"
description = "MLOps Financial API, responde a la prediccion del precio de las acciones a futuro"
readme = "README.md"
license = "MIT"
authors = [
    {name = "John Fernando Cruz", email = "jfcruz.ibp@gmail.com"}
]
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "pydantic>=2.10.0",
    "pandas>=2.2.0",
    "numpy>=2.0.0",
    "scikit-learn>=1.6.0",
    "yfinance>=0.2.0",
    "joblib>=1.4.0"
]

[project.scripts]
start = "uvicorn src.financial_api.api:app --host 0.0.0.0 --port 8000"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false  # ← AGREGAR ESTA LÍNEA

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
black = "^24.0.0"
ruff = "^0.5.0"